{% extends 'onlinecourse/base.html' %}
{% block title %}Sign up | OnlineCourse{% endblock %}
{% block content %}
<div class="auth-card card border-0 shadow-sm mx-auto">
  <div class="card-body p-5">
    <h1 class="h2 mb-2">Create an account</h1>
    <p class="text-secondary mb-4">Enroll in courses and complete assessments.</p>
    {% if message %}<div class="alert alert-danger">{{ message }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">First name<input class="form-control" name="firstname"></label></div>
        <div class="col-md-6"><label class="form-label">Last name<input class="form-control" name="lastname"></label></div>
        <div class="col-12"><label class="form-label w-100">Username<input class="form-control" name="username" required></label></div>
        <div class="col-12"><label class="form-label w-100">Password<input class="form-control" type="password" name="psw" required></label></div>
      </div>
      <button class="btn btn-primary btn-lg w-100 mt-4">Create account</button>
    </form>
  </div>
</div>
{% endblock %}
