{% extends 'onlinecourse/base.html' %}
{% block title %}Login | OnlineCourse{% endblock %}
{% block content %}
<div class="auth-card card border-0 shadow-sm mx-auto">
  <div class="card-body p-5">
    <h1 class="h2 mb-2">Welcome back</h1>
    <p class="text-secondary mb-4">Log in to continue your course.</p>
    {% if message %}<div class="alert alert-danger">{{ message }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input class="form-control form-control-lg" id="username" name="username" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="psw">Password</label>
        <input class="form-control form-control-lg" id="psw" type="password" name="psw" required>
      </div>
      <button class="btn btn-primary btn-lg w-100">Login</button>
    </form>
    <p class="small text-secondary mt-4 mb-0">Demo: <code>demo</code> / <code>demo12345</code></p>
  </div>
</div>
{% endblock %}
